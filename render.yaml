services:
  - type: web
    name: product-importer-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: product-importer-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: product-importer-redis
          property: connectionString
      - key: API_CORS_ORIGINS
        fromService:
          type: web
          name: product-importer-web
          property: url
      - key: UPLOAD_DIR
        value: /tmp/product-imports
      - key: CELERY_CONCURRENCY
        value: "1"

  - type: web
    name: product-importer-web
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      - key: API_URL
        fromService:
          type: web
          name: product-importer-api
          property: url

  - type: keyvalue
    name: product-importer-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere

databases:
  - name: product-importer-postgres
    plan: free
    databaseName: products
    user: product_importer
